[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.2.7"
description = "Multi-host code agent orchestration with SSH, session persistence, routing, and mailbox IPC"
license = "MIT"
requires-python = ">=3.10"
dependencies = []


[project.scripts]
postmesh = "codeagent.cli:main"
postmesh-remote-exec = "codeagent.remote_exec:main"
mailbox = "codeagent.mailbox.cli:main"
mailbox-hook = "codeagent.mailbox.hook:main"
mailbox-health = "codeagent.mailbox.health:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=codeagent --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: integration tests gated on --run-integration",
]
