[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "Multi-host code agent orchestration with SSH, session persistence, and routing"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codeagent = "codeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
